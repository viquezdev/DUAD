<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="css/change-password.css" />
    <script src="js/change-password.js" defer></script>
  </head>

  <body>
    <div class="main-container">
      <form class="change-password-form">
        <h1 class="main-title">Change Password</h1>

        <label for="user_id">User ID</label>
        <input type="text" id="user_id" name="userId" />

        <label for="old_password">Current Password</label>
        <input type="password" id="old_password" name="oldPassword" />

        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="newPassword" />

        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirmPassword" />

        <input class="update-btn" type="submit" value="Update Password" />

        <p class="message"></p>
      </form>
    </div>
  </body>
</html>
