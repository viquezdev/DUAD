<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/login.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="js/pages/login.js" defer></script>
  </head>
  <body>
    <header>
      <nav class="navbar-container">
        <div class="nav-left">
          <a class="nav-brand"
            ><img src="assets/icons/logo.png" alt="logo" class="brand-image"
          /></a>
          <a href="index.html" class="nav-button">PetStore</a>
        </div>
        <div class="nav-center">
          <a href="index.html" class="nav-button">Inicio</a>
          <a href="products.html" class="nav-button">Productos</a>
          <a class="nav-button">Acerca de</a>
        </div>
        <div class="nav-right">
          <button id="btnLogin" class="btn">Iniciar sesión</button>
          <p id="userInfo" class="hidden"></p>
          <button id="btnLogout" class="btn hidden">Cerrar sesión</button>
          <div class="cart-icon" id="cartIcon" class="hidden">
            🛒
            <span id="cartCount" class="cart-count hidden">0</span>
          </div>
        </div>
      </nav>
    </header>

    <section>
      <div class="banner-global">
        <div class="main-container">
          <form class="login-form" action="">
            <div class="form-container">
              <p class="main-text">Iniciar sesión</p>

              <input
                type="text"
                id="username"
                name="username"
                placeholder="Nombre de usuario"
                required
              />
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Contraseña"
                required
              />

              <button class="btn-register">Ingresar</button>
              <p class="error-message"></p>
              <p>
                ¿No tienes una cuenta?
                <a class="btn-link" href="register.html">Crear cuenta</a>
              </p>
              <p>
                <a href="index.html">Volver a inicio</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
