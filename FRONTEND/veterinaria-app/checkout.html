<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/checkout.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/pages/checkout.js" defer></script>
  </head>

  <body>
    <header>
      <nav class="navbar-container">
        <div class="nav-left">
          <a class="nav-brand"
            ><img src="assets/icons/logo.png" alt="logo" class="brand-image"
          /></a>
          <a href="index.html" class="nav-button">PetStore</a>
        </div>
        <div class="nav-center">
          <a href="index.html" class="nav-button">Inicio</a>
          <a href="products.html" class="nav-button">Productos</a>
          <a class="nav-button">Acerca de</a>
          <a
            href="admin-dashboard.html"
            id="adminLink"
            class="nav-button hidden"
            >Administración</a
          >
        </div>
        <div class="nav-right">
          <button id="btnLogin" class="btn">Iniciar sesión</button>
          <p id="userInfo" class="hidden"></p>
          <button id="btnLogout" class="btn hidden">Cerrar sesión</button>
          <div class="cart-icon" id="cartIcon" class="hidden">
            🛒
            <span id="cartCount" class="cart-count hidden">0</span>
          </div>
        </div>
      </nav>
    </header>
    <main class="checkout-page">
      <section class="checkout-form">
        <h2>Información de envío</h2>

        <form id="checkoutForm">
          <label for="address"> Dirección de entrega </label>

          <input
            type="text"
            id="address"
            placeholder="Provincia, cantón, dirección exacta"
            required
          />

          <label for="paymentMethod"> Método de pago </label>

          <select id="paymentMethod" required>
            <option value="">Selecciona un método</option>

            <option value="credit_card">Tarjeta de crédito</option>

            <option value="debit_card">Tarjeta de débito</option>

            <option value="paypal">PayPal</option>
          </select>
        </form>
      </section>

      <section class="checkout-summary">
        <h2>Resumen del pedido</h2>

        <div id="summaryContainer"></div>

        <div class="summary-prices">
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal"></span>
          </div>

          <div class="summary-total">
            <span>Total</span>
            <span id="checkoutTotal"></span>
          </div>
        </div>

        <button id="btnConfirm" class="btn-checkout">Confirmar compra</button>

        <a href="cart.html" class="btn-cancel"> Cancelar </a>
      </section>
    </main>
  </body>
</html>
