<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/index.css" />
  </head>
  <header>
    <nav class="navbar-container">
      <div class="nav-left">
        <a class="nav-brand"
          ><img src="assets/icons/logo.png" alt="logo" class="brand-image"
        /></a>
        <a class="nav-button">PetStore</a>
      </div>
      <div class="nav-center">
        <a class="nav-button">Inicio</a>
        <a class="nav-button">Productos</a>
        <a class="nav-button">Acerca de</a>
      </div>
      <div class="nav-right">
        <button class="btn">Iniciar sesión</button>
      </div>
    </nav>
  </header>
  <body>
    <section>
      <div class="form-container">
        <form action="">
          <h1>Crear cuenta</h1>
          <p>Crea tu cuenta para acceder a todas las funciones.</p>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Nombre de usuario"
            required
          />
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Correo electrónico"
            required
          />
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Contraseña"
            required
          />
          <input
            type="password"
            id="verify-password"
            name="verify-password"
            placeholder="Confirmar contraseña"
            required
          />
          <p>¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></p>
        </form>
      </div>
    </section>
  </body>
</html>
