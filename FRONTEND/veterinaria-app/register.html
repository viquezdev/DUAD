<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/register.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/pages/register.js" defer></script>
  </head>

  <body>
    <header>
      <nav class="navbar-container">
        <div class="nav-left">
          <a class="nav-brand"
            ><img src="assets/icons/logo.png" alt="logo" class="brand-image"
          /></a>
          <a href="index.html" class="nav-button">PetStore</a>
        </div>
        <div class="nav-center">
          <a href="index.html" class="nav-button">Inicio</a>
          <a href="products.html" class="nav-button">Productos</a>
          <a class="nav-button">Acerca de</a>
          <a
            href="admin-dashboard.html"
            id="adminLink"
            class="nav-button hidden"
            >Administración</a
          >
        </div>
        <div class="nav-right">
          <button button id="btnLogin" class="btn">Iniciar sesión</button>
          <p id="userInfo" class="hidden"></p>
          <button id="btnLogout" class="btn hidden">Cerrar sesión</button>
          <div class="cart-icon" id="cartIcon" class="hidden">
            🛒
            <span id="cartCount" class="cart-count hidden">0</span>
          </div>
        </div>
      </nav>
    </header>
    <section>
      <div class="banner-global">
        <div class="main-container">
          <form class="login-form" action="">
            <div class="form-container">
              <p class="main-text">Crear cuenta</p>
              <p>Crea tu cuenta para acceder a todas las funciones.</p>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Nombre de usuario"
                required
              />
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Correo electrónico"
                required
              />
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Contraseña"
                required
              />
              <input
                type="password"
                id="verify-password"
                name="verify-password"
                placeholder="Confirmar contraseña"
                required
              />
              <p class="error-message"></p>
              <button class="btn-register">Registrarse</button>
              <p>
                ¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
